name: Deploy Infrastructure and Site

on:
  push:
    branches: [main, dev]

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    outputs:
      public_ip: ${{ steps.get-ip.outputs.ip }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/web-server.yaml \
            --stack-name my-web-server-${{ github.ref_name }} \
            --parameter-overrides KeyName=student-key \
            --region us-east-1 \
            --no-fail-on-empty-changeset

      - name: Get public IP
        id: get-ip
        run: |
          IP=$(aws cloudformation describe-stacks \
            --stack-name my-web-server-${{ github.ref_name }} \
            --query "Stacks[0].Outputs[0].OutputValue" \
            --output text \
            --region us-east-1)
          echo "Public IP: $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

  deploy-site:
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Save SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Copy site files (retries until the new server is ready)
        run: |
          for i in {1..15}; do
            scp -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i key.pem \
              index.html style.css script.js \
              ec2-user@${{ needs.deploy-infra.outputs.public_ip }}:/usr/share/nginx/html/ && break
            echo "Server not ready yet, retrying in 10s..."
            sleep 10
          done